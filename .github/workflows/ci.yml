name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Build above runs with NEXT_PUBLIC_CLUB_ENABLED unset (the default/demo
      # build), so the client bundle must contain no club code. Guards
      # invariant #5: club off == byte-for-byte today.
      - name: Flag-off parity
        run: npm run check:parity
